name: 'Setup rust'
description: 'Rust setup, including cache configuration'
inputs:
  targets:
    description: 'Cargo target'
    required: true
  components:
    description: 'Rustup components'
    required: false
    default: ''
runs:
  using: 'composite'
  steps:
    - name: Print rustup toolchain version
      shell: bash
      id: rustup-version
      run: |
        export RUST_TOOLCHAIN_VERSION="$(grep 'channel' rust-toolchain.toml | head -1 | awk -F '"' '{print $2}')"
        echo "Rust toolchain version: $RUST_TOOLCHAIN_VERSION"
        echo "RUST_TOOLCHAIN_VERSION=$RUST_TOOLCHAIN_VERSION" >> "$GITHUB_OUTPUT"
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: '${{ steps.rustup-version.outputs.RUST_TOOLCHAIN_VERSION }}'
        targets: ${{ inputs.targets }}
        components: ${{ inputs.components }}
      env:
        CARGO_INCREMENTAL: '1'

    # CMake caches absolute paths to cargo-zigbuild's versioned compiler wrappers.
    # A tool upgrade must not restore build output referring to the old wrappers.
    - name: Get Zig toolchain cache key
      if: ${{ contains(inputs.targets, 'musl') }}
      id: zig-toolchain
      shell: bash
      run: |
        cargo_zigbuild_version="$(cargo zigbuild --version)"
        zig_version="$(zig version)"
        echo "cache-key=-${cargo_zigbuild_version// /-}-zig-${zig_version}" >> "$GITHUB_OUTPUT"

    - name: Cache cargo
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry/
          ~/.cargo/git/db/
          ~/.napi-rs
          target/${{ inputs.targets }}
        key: ${{ steps.rustup-version.outputs.RUST_TOOLCHAIN_VERSION }}-${{ inputs.targets }}-cargo-cache${{ steps.zig-toolchain.outputs.cache-key }}
